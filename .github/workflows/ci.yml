name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: farismnrr/portofolio/portfolio-app
  RUST_TARGET_AMD64: x86_64-unknown-linux-musl
  RUST_TARGET_ARM64: aarch64-unknown-linux-musl

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      server: ${{ steps.filter.outputs.server }}
      image: ${{ steps.filter.outputs.image }}
      deploy: ${{ steps.filter.outputs.deploy }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
            fi
          fi

          git diff --name-only "$base" "$GITHUB_SHA" | tee /tmp/changed-files.txt

          frontend=false
          server=false
          image=false
          deploy=false
          ci=false

          while IFS= read -r path; do
            case "$path" in
              frontend/*)
                frontend=true
                image=true
                ;;
              server/*)
                server=true
                image=true
                ;;
              Dockerfile|.dockerignore)
                image=true
                ;;
              compose.yaml)
                deploy=true
                ;;
              .github/workflows/ci.yml)
                ci=true
                ;;
            esac
          done < /tmp/changed-files.txt

          if [ "$image" = true ]; then
            deploy=true
          fi

          {
            echo "frontend=$frontend"
            echo "server=$server"
            echo "image=$image"
            echo "deploy=$deploy"
            echo "ci=$ci"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.image == 'true' || needs.changes.outputs.ci == 'true'
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('frontend/package.json', 'frontend/.npmrc') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Generate npm lockfile without warnings
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-offline 2>&1 | tee /tmp/npm-lock.log
          if grep -Eiq '(^|[[:space:]])(npm warn|warning)([[:space:]:]|$)' /tmp/npm-lock.log; then
            echo "Dependency resolution emitted a warning; warnings are CI failures."
            exit 1
          fi

      - name: Install frontend dependencies without warnings
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund --prefer-offline 2>&1 | tee /tmp/npm-ci.log
          if grep -Eiq '(^|[[:space:]])(npm warn|warning)([[:space:]:]|$)' /tmp/npm-ci.log; then
            echo "npm ci emitted a warning; warnings are CI failures."
            exit 1
          fi

      - name: Architecture / SOLID / DRY guard
        working-directory: frontend
        run: npm run guard

      - name: Validate Markdown and Mermaid content
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/content-check.stderr
          npm run content:check 2> >(tee /tmp/content-check.stderr >&2)
          if [ -s /tmp/content-check.stderr ]; then
            echo "Content validation wrote to stderr; warnings/errors are CI failures."
            exit 1
          fi

      - name: Strict Svelte / TypeScript diagnostics
        working-directory: frontend
        run: npm run check

      - name: Build frontend with stderr treated as failure
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/frontend-build.stderr
          npm run build 2> >(tee /tmp/frontend-build.stderr >&2)
          if [ -s /tmp/frontend-build.stderr ]; then
            echo "Frontend build wrote to stderr; warnings/errors are CI failures."
            exit 1
          fi

      - name: Install musl toolchain
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.ci == 'true' || (github.event_name == 'push' && needs.changes.outputs.image == 'true')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.ci == 'true' || (github.event_name == 'push' && needs.changes.outputs.image == 'true')
        with:
          targets: ${{ env.RUST_TARGET_AMD64 }},${{ env.RUST_TARGET_ARM64 }}
          components: rustfmt, clippy

      - name: Restore Rust dependency and tool cache
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.ci == 'true' || (github.event_name == 'push' && needs.changes.outputs.image == 'true')
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          shared-key: portfolio-musl-release-v2
          cache-targets: true
          cache-on-failure: true

      - name: Rust format
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.ci == 'true'
        working-directory: server
        run: cargo fmt --check

      - name: Rust clippy
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.ci == 'true'
        working-directory: server
        run: cargo clippy --release --target ${{ env.RUST_TARGET_AMD64 }} --all-targets --all-features -- -D warnings

      - name: Rust tests
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.ci == 'true'
        working-directory: server
        run: cargo test --release --target ${{ env.RUST_TARGET_AMD64 }} --all-targets --all-features

      - name: Build AMD64 runtime binary
        if: github.event_name == 'push' && needs.changes.outputs.image == 'true'
        working-directory: server
        run: cargo build --release --target ${{ env.RUST_TARGET_AMD64 }}

      - uses: mlugg/setup-zig@v2
        if: github.event_name == 'push' && needs.changes.outputs.image == 'true'
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild only on cache miss
        if: github.event_name == 'push' && needs.changes.outputs.image == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v cargo-zigbuild > /dev/null 2>&1; then
            echo "cargo-zigbuild restored from Rust cache."
          else
            cargo install cargo-zigbuild --locked
          fi

      - name: Build ARM64 runtime binary
        if: github.event_name == 'push' && needs.changes.outputs.image == 'true'
        working-directory: server
        run: cargo zigbuild --release --target ${{ env.RUST_TARGET_ARM64 }}

      - name: Stage architecture-specific runtime binaries
        if: github.event_name == 'push' && needs.changes.outputs.image == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/amd64 release/arm64
          cp "server/target/${RUST_TARGET_AMD64}/release/portfolio-server" release/amd64/portfolio-server
          cp "server/target/${RUST_TARGET_ARM64}/release/portfolio-server" release/arm64/portfolio-server
          chmod +x release/amd64/portfolio-server release/arm64/portfolio-server
          file release/amd64/portfolio-server release/arm64/portfolio-server

      - name: Upload runtime binaries
        if: github.event_name == 'push' && needs.changes.outputs.image == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: runtime-binaries
          path: release/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-24.04
    needs: [changes, build]
    if: github.event_name == 'push' && needs.changes.outputs.image == 'true' && needs.build.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download runtime binaries
        uses: actions/download-artifact@v7
        with:
          name: runtime-binaries
          path: release

      - name: Restore executable permissions
        run: chmod +x release/amd64/portfolio-server release/arm64/portfolio-server

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push multi-architecture runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=portfolio-runtime
          cache-to: type=gha,mode=max,scope=portfolio-runtime

  ai-smoke:
    name: ai smoke
    runs-on: [self-hosted, Linux, X64]
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.server == 'true' || needs.changes.outputs.ci == 'true')
    env:
      NINE_ROUTER_URL: ${{ vars.NINE_ROUTER_URL }}
      NINE_ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
      NINE_ROUTER_CONNECT_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_CONNECT_TIMEOUT_SECONDS }}
      NINE_ROUTER_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_TIMEOUT_SECONDS }}
      NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
    steps:
      - name: Check configured 9router model
        shell: bash
        run: |
          set -euo pipefail

          for name in NINE_ROUTER_URL NINE_ROUTER_MODEL NINE_ROUTER_CONNECT_TIMEOUT_SECONDS NINE_ROUTER_TIMEOUT_SECONDS NINE_ROUTER_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "${name} is not available on the self-hosted runner."
              exit 1
            fi
          done

          payload="$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["NINE_ROUTER_MODEL"], "reasoning_effort": "low", "messages": [{"role": "user", "content": "hi"}]}))')"

          response="$(curl --fail --silent --show-error \
            "${NINE_ROUTER_URL%/}/chat/completions" \
            -H "Authorization: Bearer ${NINE_ROUTER_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "$payload")"

          answer="$(printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data["choices"][0]["message"]["content"].strip())')"

          if [ -z "$answer" ]; then
            echo "9router returned an empty answer."
            exit 1
          fi

          echo "Configured 9router model smoke test returned a non-empty answer."

  deploy:
    name: deploy
    runs-on: [self-hosted, Linux, X64]
    needs: [changes, build, publish]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    permissions:
      contents: read
      packages: read
    concurrency:
      group: portfolio-self-hosted
      cancel-in-progress: true
    steps:
      - name: Repair self-hosted workspace ownership
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            alpine:3.20 \
            chown -R "$(id -u):$(id -g)" /work

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy latest to Arch host
        env:
          PORTFOLIO_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          PORTFOLIO_PORT: "3001"
          NINE_ROUTER_URL: ${{ vars.NINE_ROUTER_URL }}
          NINE_ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
          NINE_ROUTER_CONNECT_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_CONNECT_TIMEOUT_SECONDS }}
          NINE_ROUTER_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_TIMEOUT_SECONDS }}
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
        run: |
          docker compose -p portofolio pull
          docker compose -p portofolio up -d --remove-orphans
          docker compose -p portofolio ps
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3001/ > /dev/null
