name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: farismnrr/portofolio/portfolio-app
  RUST_TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Architecture / SOLID / DRY guard
        working-directory: frontend
        run: npm run guard

      - name: Generate npm lockfile without warnings
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm install --package-lock-only 2>&1 | tee /tmp/npm-lock.log
          if grep -Eiq '(^|[[:space:]])(npm warn|warning)([[:space:]:]|$)' /tmp/npm-lock.log; then
            echo "Dependency resolution emitted a warning; warnings are CI failures."
            exit 1
          fi

      - name: Restore npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Install frontend dependencies without warnings
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci.log
          if grep -Eiq '(^|[[:space:]])(npm warn|warning)([[:space:]:]|$)' /tmp/npm-ci.log; then
            echo "npm ci emitted a warning; warnings are CI failures."
            exit 1
          fi

      - name: Validate Markdown and Mermaid content
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/content-check.stderr
          npm run content:check 2> >(tee /tmp/content-check.stderr >&2)
          if [ -s /tmp/content-check.stderr ]; then
            echo "Content validation wrote to stderr; warnings/errors are CI failures."
            exit 1
          fi

      - name: Strict Svelte / TypeScript diagnostics
        working-directory: frontend
        run: npm run check

      - name: Build frontend with stderr treated as failure
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/frontend-build.stderr
          npm run build 2> >(tee /tmp/frontend-build.stderr >&2)
          if [ -s /tmp/frontend-build.stderr ]; then
            echo "Frontend build wrote to stderr; warnings/errors are CI failures."
            exit 1
          fi

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}
          components: rustfmt, clippy

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          shared-key: portfolio-musl-release
          cache-targets: true
          cache-on-failure: true

      - name: Rust format
        working-directory: server
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: server
        run: cargo clippy --release --target ${{ env.RUST_TARGET }} --all-targets --all-features -- -D warnings

      - name: Build embedded single binary
        working-directory: server
        run: cargo build --release --target ${{ env.RUST_TARGET }}

      - name: Stage runtime binary
        run: |
          mkdir -p release
          cp "server/target/${RUST_TARGET}/release/portfolio-server" release/portfolio-server
          chmod +x release/portfolio-server

      - uses: docker/setup-buildx-action@v4
        if: github.event_name == 'push'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push prebuilt Rust runtime
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest


  ai-smoke:
    name: ai smoke
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'pull_request'
    steps:
      - name: Check local 9router with GPT-6 Luna
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NINE_ROUTER_API_KEY:-}" ]; then
            echo "NINE_ROUTER_API_KEY is not available on the self-hosted runner."
            exit 1
          fi

          response="$(curl --fail --silent --show-error \
            http://127.0.0.1:20128/v1/chat/completions \
            -H "Authorization: Bearer ${NINE_ROUTER_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{
              "model": "gpt-6-luna",
              "reasoning_effort": "low",
              "messages": [{"role": "user", "content": "hi"}]
            }')"

          answer="$(printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data["choices"][0]["message"]["content"].strip())')"

          if [ -z "$answer" ]; then
            echo "9router returned an empty answer."
            exit 1
          fi

          echo "9router GPT-6 Luna smoke test returned a non-empty answer."

  deploy:
    runs-on: [self-hosted, Linux, X64]
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: portfolio-self-hosted
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy latest
        env:
          PORTFOLIO_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          PORTFOLIO_PORT: "3001"
        run: |
          docker compose -p portofolio pull
          docker compose -p portofolio up -d --remove-orphans
          docker compose -p portofolio ps
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3001/ > /dev/null
