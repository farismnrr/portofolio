name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: farismnrr/portofolio/portfolio-app
  RUST_TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Architecture / SOLID / DRY guard
        working-directory: frontend
        run: npm run guard

      - name: Generate npm lockfile without warnings
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm install --package-lock-only 2>&1 | tee /tmp/npm-lock.log
          if grep -Eiq '(^|[[:space:]])(npm warn|warning)([[:space:]:]|$)' /tmp/npm-lock.log; then
            echo "Dependency resolution emitted a warning; warnings are CI failures."
            exit 1
          fi

      - name: Restore npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Install frontend dependencies without warnings
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci.log
          if grep -Eiq '(^|[[:space:]])(npm warn|warning)([[:space:]:]|$)' /tmp/npm-ci.log; then
            echo "npm ci emitted a warning; warnings are CI failures."
            exit 1
          fi

      - name: Validate Markdown and Mermaid content
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/content-check.stderr
          npm run content:check 2> >(tee /tmp/content-check.stderr >&2)
          if [ -s /tmp/content-check.stderr ]; then
            echo "Content validation wrote to stderr; warnings/errors are CI failures."
            exit 1
          fi

      - name: Strict Svelte / TypeScript diagnostics
        working-directory: frontend
        run: npm run check

      - name: Build frontend with stderr treated as failure
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/frontend-build.stderr
          npm run build 2> >(tee /tmp/frontend-build.stderr >&2)
          if [ -s /tmp/frontend-build.stderr ]; then
            echo "Frontend build wrote to stderr; warnings/errors are CI failures."
            exit 1
          fi

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}
          components: rustfmt, clippy

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          shared-key: portfolio-musl-release
          cache-targets: true
          cache-on-failure: true

      - name: Rust format
        working-directory: server
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: server
        run: cargo clippy --release --target ${{ env.RUST_TARGET }} --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: server
        run: cargo test --release --target ${{ env.RUST_TARGET }} --all-targets --all-features

      - name: Build embedded single binary
        working-directory: server
        run: cargo build --release --target ${{ env.RUST_TARGET }}

      - name: Stage runtime binary
        run: |
          mkdir -p release
          cp "server/target/${RUST_TARGET}/release/portfolio-server" release/portfolio-server
          chmod +x release/portfolio-server

      - uses: docker/setup-buildx-action@v4
        if: github.event_name == 'push'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push prebuilt Rust runtime
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest


  ai-smoke:
    name: ai smoke
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'pull_request'
    env:
      NINE_ROUTER_URL: ${{ vars.NINE_ROUTER_URL }}
      NINE_ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
      NINE_ROUTER_CONNECT_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_CONNECT_TIMEOUT_SECONDS }}
      NINE_ROUTER_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_TIMEOUT_SECONDS }}
      NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
    steps:
      - name: Check configured 9router model
        shell: bash
        run: |
          set -euo pipefail

          for name in NINE_ROUTER_URL NINE_ROUTER_MODEL NINE_ROUTER_CONNECT_TIMEOUT_SECONDS NINE_ROUTER_TIMEOUT_SECONDS NINE_ROUTER_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "${name} is not available on the self-hosted runner."
              exit 1
            fi
          done

          payload="$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["NINE_ROUTER_MODEL"], "reasoning_effort": "low", "messages": [{"role": "user", "content": "hi"}]}))')"

          response="$(curl --fail --silent --show-error \
            "${NINE_ROUTER_URL%/}/chat/completions" \
            -H "Authorization: Bearer ${NINE_ROUTER_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "$payload")"

          answer="$(printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data["choices"][0]["message"]["content"].strip())')"

          if [ -z "$answer" ]; then
            echo "9router returned an empty answer."
            exit 1
          fi

          echo "Configured 9router model smoke test returned a non-empty answer."

  deploy:
    runs-on: [self-hosted, Linux, X64]
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: portfolio-self-hosted
      cancel-in-progress: true
    steps:
      - name: Repair self-hosted workspace ownership
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            alpine:3.20 \
            chown -R "$(id -u):$(id -g)" /work

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy latest
        env:
          PORTFOLIO_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          PORTFOLIO_PORT: "3001"
          NINE_ROUTER_URL: ${{ vars.NINE_ROUTER_URL }}
          NINE_ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
          NINE_ROUTER_CONNECT_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_CONNECT_TIMEOUT_SECONDS }}
          NINE_ROUTER_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_TIMEOUT_SECONDS }}
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
        run: |
          docker compose -p portofolio pull
          docker compose -p portofolio up -d --remove-orphans
          docker compose -p portofolio ps
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3001/ > /dev/null

  e2e:
    name: production CV pagination e2e
    runs-on: [self-hosted, Linux, X64]
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: portfolio-self-hosted
      cancel-in-progress: true
    env:
      PORTFOLIO_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
    steps:
      - name: Repair self-hosted workspace ownership
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            alpine:3.20 \
            chown -R "$(id -u):$(id -g)" /work

      - uses: actions/checkout@v7

      - name: Run production CV generation E2E
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network host \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/frontend:/work" \
            -w /work \
            -e HOME=/tmp \
            -e E2E_BASE_URL=http://127.0.0.1:3001 \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            bash -lc 'npm install --package-lock-only && npm ci && npm run test:e2e'

      - name: Inspect generated PDF structure and completeness
        shell: bash
        run: |
          set -euo pipefail

          test -s frontend/test-results/generated-cv.pdf

          docker run --rm \
            --entrypoint sh \
            -v "$PWD/frontend/test-results:/data:ro" \
            "$PORTFOLIO_IMAGE" \
            -lc '
              set -eu
              pages="$(pdfinfo /data/generated-cv.pdf | awk "/^Pages:/ { print \$2 }")"
              test "$pages" = "2"

              pdftotext /data/generated-cv.pdf /tmp/cv.txt

              for required in \
                "PROFESSIONAL SUMMARY" \
                "SKILLS" \
                "WORK EXPERIENCE" \
                "PROJECTS" \
                "CERTIFICATIONS" \
                "EDUCATION" \
                "UPN Veteran East Java"
              do
                grep -Fqi "$required" /tmp/cv.txt || {
                  echo "Missing required PDF content: $required"
                  exit 1
                }
              done
            '

      - name: Show portfolio logs on E2E failure
        if: failure()
        shell: bash
        run: docker compose -p portofolio logs --no-color --tail=250 portfolio
