name: Engineering Guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: engineering-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Full guard
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run engineering guard
        run: ./.agents/scripts/engineering-guard.sh portfolio full
