name: Fast AMD64 Build + Deploy

on:
  push:
    branches:
      - dev
    paths:
      - "frontend/**"
      - "server/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/scripts/**"
      - ".github/workflows/fast-guardrail-build-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TARGET_AMD64: x86_64-unknown-linux-musl
  RUSTUP_TOOLCHAIN: stable
  RUSTFLAGS: -D warnings
  DEV_IMAGE: portfolio-app:dev
  VITE_ROLE_MATCH_ENABLED: "true"

concurrency:
  group: fast-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: build + deploy
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: portfolio-self-hosted
      cancel-in-progress: true

    steps:
      - name: Repair workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            alpine:3.20 \
            chown -R "$(id -u):$(id -g)" /work

      - uses: actions/checkout@v7
        with:
          clean: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up pinned Zig
        shell: bash
        run: bash .github/scripts/setup-zig.sh

      - name: Build and validate
        shell: bash
        run: |
          set -euo pipefail

          cache_root="$HOME/.cache/portfolio-ci"
          export NPM_CONFIG_CACHE="$cache_root/npm"
          export CARGO_TARGET_DIR="$cache_root/cargo-target"
          export CARGO_HOME="$cache_root/cargo-home"
          export RUSTUP_HOME="$cache_root/rustup"
          export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"

          mkdir -p \
            "$NPM_CONFIG_CACHE" \
            "$CARGO_TARGET_DIR" \
            "$CARGO_HOME/bin" \
            "$RUSTUP_HOME"

          git reset --hard "$GITHUB_SHA"
          git clean -ffdx \
            -e frontend/node_modules/ \
            -e frontend/dist/ \
            -e release/amd64/

          (
            cd frontend
            npm install --ignore-scripts --no-audit --no-fund --prefer-offline
            npm rebuild esbuild --dangerously-allow-all-scripts --no-audit --no-fund
            npm run guard
            npm run content:check
            npm run check
            npm run build
          )

          command -v rustup >/dev/null 2>&1 || {
            echo "rustup is required on the self-hosted runner."
            exit 1
          }

          if ! rustup toolchain list | grep -q '^stable'; then
            rustup toolchain install stable \
              --profile minimal \
              --component rustfmt \
              --component clippy \
              --target "$RUST_TARGET_AMD64"
          else
            rustup component add --toolchain stable rustfmt clippy
            if ! rustup target list --toolchain stable --installed | grep -qx "$RUST_TARGET_AMD64"; then
              rustup target add --toolchain stable "$RUST_TARGET_AMD64"
            fi
          fi

          if ! command -v cargo-zigbuild >/dev/null 2>&1; then
            cargo install cargo-zigbuild --locked
          fi

          (
            cd server
            cargo fmt --check
            cargo clippy --release --all-targets --features role-match -- -D warnings
            cargo test --release --all-targets --features role-match
            cargo zigbuild --release --target "$RUST_TARGET_AMD64" --features role-match
          )

          mkdir -p release/amd64
          cp "$CARGO_TARGET_DIR/$RUST_TARGET_AMD64/release/portfolio-server" release/amd64/portfolio-server
          chmod +x release/amd64/portfolio-server

          DOCKER_BUILDKIT=1 docker build \
            --build-arg TARGETARCH=amd64 \
            --tag "$DEV_IMAGE" \
            .

      - name: Deploy and verify
        env:
          PORTFOLIO_IMAGE: ${{ env.DEV_IMAGE }}
          PORTFOLIO_PORT: "3001"
          PORTFOLIO_DATABASE_URL: ${{ secrets.PORTFOLIO_DATABASE_URL }}
          NINE_ROUTER_URL: ${{ vars.NINE_ROUTER_URL }}
          NINE_ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
          NINE_ROUTER_CONNECT_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_CONNECT_TIMEOUT_SECONDS }}
          NINE_ROUTER_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_TIMEOUT_SECONDS }}
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_check="Deploy setup"

          report_deploy_failure() {
            local status="$1"
            local failed_command="$2"
            local container_id
            local logs
            echo "::error title=${deploy_check}::Command failed with exit ${status}: ${failed_command}"
            container_id="$(docker compose -p portofolio ps -q portfolio 2>/dev/null || true)"
            if [[ -n "$container_id" ]]; then
              logs="$(docker logs --tail 40 "$container_id" 2>&1 || true)"
            else
              logs="$(docker logs --tail 40 portofolio-portfolio-1 2>&1 || true)"
            fi
            logs="$(printf '%s' "$logs" | sed -E \
              -e 's#(postgres(ql)?://)[^/@[:space:]]+(:[^/@[:space:]]+)?@#\1<redacted>@#g' \
              -e 's#(Bearer )[A-Za-z0-9._~+/=-]+#\1<redacted>#g' \
              -e 's#((api[_-]?key|password|token)[=:][[:space:]]*)[^[:space:]]+#\1<redacted>#Ig' \
              -e 's#(https?://)[^/@[:space:]]+:[^/@[:space:]]+@#\1<redacted>@#g')"
            logs="${logs//%/%25}"
            logs="${logs//$'\r'/%0D}"
            logs="${logs//$'\n'/%0A}"
            echo "::error title=Portfolio container logs (tail 40)::$logs"
          }
          trap 'report_deploy_failure "$?" "$BASH_COMMAND"' ERR

          deploy_check="PORTFOLIO_DATABASE_URL secret"
          : "${PORTFOLIO_DATABASE_URL:?Configure the PORTFOLIO_DATABASE_URL repository secret}"

          deploy_check="shared-postgres health"
          postgres_health="$(docker inspect --format '{{.State.Health.Status}}' shared-postgres)"
          if [[ "$postgres_health" != healthy ]]; then
            echo "::error title=shared-postgres health::Expected healthy; observed ${postgres_health}"
            exit 1
          fi

          deploy_check="Compose configuration"
          docker compose -p portofolio config --quiet

          deploy_check="Compose application startup"
          docker compose -p portofolio up -d --remove-orphans --no-build
          deploy_check="Compose application status"
          docker compose -p portofolio ps

          deploy_check="Homepage reachable"
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:3001/ > /dev/null

          deploy_check="Homepage media hydration"
          hydration_dom="$(mktemp)"
          chromium_stderr="$(mktemp)"
          if ! docker compose -p portofolio exec -T \
            -e XDG_CONFIG_HOME=/tmp/portfolio-chromium-config \
            -e XDG_CACHE_HOME=/tmp/portfolio-chromium-cache \
            portfolio chromium \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir=/tmp/portfolio-hydration-check \
            --window-size=1440,1200 \
            --virtual-time-budget=6000 \
            --dump-dom \
            http://127.0.0.1:3001/ \
            > "$hydration_dom" 2> "$chromium_stderr"; then
            cat "$chromium_stderr" >&2
            echo "::error title=Homepage media hydration::Chromium failed to render the homepage DOM; see the sanitized container log annotation."
            rm -f "$hydration_dom" "$chromium_stderr"
            exit 1
          fi
          rm -f "$chromium_stderr"
          python3 - "$hydration_dom" <<'PY'
          import re
          import sys

          html = open(sys.argv[1], encoding='utf-8').read()
          media = re.findall(r'<div\b[^>]*\bdata-media-image(?:="")?[^>]*>', html, re.S)
          eager = [tag for tag in media if 'data-eager="true"' in tag]
          if not eager:
              raise SystemExit('hydrated eager media image not found')
          if any('data-loaded="true"' not in tag for tag in eager):
              raise SystemExit('eager media image remained in skeleton state after hydration')
          print(f'media_hydration_eager_loaded={len(eager)}')
          PY
          rm -f "$hydration_dom"

          deploy_check="Mermaid rendering and vendor assets"
          mermaid_dom="$(mktemp)"
          chromium_stderr="$(mktemp)"
          if ! docker compose -p portofolio exec -T \
            -e XDG_CONFIG_HOME=/tmp/portfolio-chromium-config \
            -e XDG_CACHE_HOME=/tmp/portfolio-chromium-cache \
            portfolio chromium \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir=/tmp/portfolio-mermaid-check \
            --window-size=1920,2000 \
            --virtual-time-budget=8000 \
            --dump-dom \
            http://127.0.0.1:3001/projects/sensio-notes \
            > "$mermaid_dom" 2> "$chromium_stderr"; then
            cat "$chromium_stderr" >&2
            echo "::error title=Mermaid rendering and vendor assets::Chromium failed to render the Sensio Notes page; see the sanitized container log annotation."
            rm -f "$mermaid_dom" "$chromium_stderr"
            exit 1
          fi
          rm -f "$chromium_stderr"
          python3 - "$mermaid_dom" <<'PY'
          import re
          import sys

          html = open(sys.argv[1], encoding='utf-8').read()
          pre = re.search(r'<pre class="[^"]*\bmermaid\b[^"]*"[^>]*>(.*?)</pre>', html, re.S)
          if not pre:
              raise SystemExit('live Mermaid <pre> not found')
          svg = re.search(r'<svg\b([^>]*)>', pre.group(1), re.S)
          if not svg:
              raise SystemExit('live Mermaid SVG not rendered')
          attrs = svg.group(1)
          print('mermaid_live_svg=' + re.sub(r'\s+', ' ', attrs).strip())
          for name in ('viewBox', 'width', 'height', 'style'):
              match = re.search(rf'\b{name}="([^"]*)"', attrs)
              print(f'mermaid_live_{name}=' + (match.group(1) if match else '<missing>'))
          viewbox = re.search(r'\bviewBox="([^"]*)"', attrs)
          if not viewbox:
              raise SystemExit('live Mermaid viewBox missing')
          _, _, width, height = map(float, viewbox.group(1).split())
          if not (500 < width < 3000 and 50 < height < 800):
              raise SystemExit(f'live Mermaid geometry abnormal: {width} x {height}')
          nodes = re.findall(r'<g\b[^>]*class="node\b', pre.group(1))
          if len(nodes) != 4 or '<foreignObject' in pre.group(1):
              raise SystemExit('live Mermaid user journey needs four SVG-labelled nodes')
          PY
          rm -f "$mermaid_dom"

          deploy_check="Old project URL redirect"
          project_redirect="$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{redirect_url}' \
            --max-redirs 0 http://127.0.0.1:3001/projects/sensio-notes)"
          if [[ "$project_redirect" != '301 http://127.0.0.1:3001/projects' ]]; then
            echo "::error title=Old project URL redirect::Expected '301 http://127.0.0.1:3001/projects'; observed '${project_redirect}'"
            exit 1
          fi
          printf 'old_project_redirect=%s\n' "$project_redirect"

          deploy_check="Profile image cache headers"
          asset_url="http://127.0.0.1:3001/images/profile/faris-munir-1024.webp"
          asset_headers="$(mktemp)"
          trap 'rm -f "$asset_headers"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused \
            -D "$asset_headers" \
            -o /dev/null \
            "$asset_url"
          etag="$(awk 'BEGIN { IGNORECASE=1 } /^etag:/ { gsub(/\r/, "", $2); print $2; exit }' "$asset_headers")"
          if [[ -z "$etag" ]]; then
            echo "::error title=Profile image cache headers::Expected a nonempty ETag; observed none"
            exit 1
          fi
          asset_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "If-None-Match: $etag" \
            "$asset_url")"
          if [[ "$asset_status" != 304 ]]; then
            echo "::error title=Profile image cache headers::Expected conditional request status 304; observed ${asset_status}"
            exit 1
          fi
          printf 'asset_conditional_cache_status=%s\n' "$asset_status"

          deploy_check="CV retrieval database evidence"
          retrieve="$(curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused \
            -X POST http://127.0.0.1:3001/api/cv/retrieve \
            -H 'Content-Type: application/json' \
            --data '{"target":"general","query":"backend PostgreSQL Rust Docker","limit":6}')"
          printf '%s\n' "$retrieve" | python3 -c 'import json,sys; d=json.load(sys.stdin); backend=d.get("backend"); evidence=d.get("evidence") or []; count=len(evidence); print("retrieval_backend=" + str(backend)); print("retrieval_evidence_count=" + str(count)); fail=lambda message: (print("::error title=CV retrieval database evidence::" + message), sys.exit(1)); backend == "pgvector+postgres-fts" or fail("Expected backend pgvector+postgres-fts; observed " + str(backend)); count > 0 or fail("Expected nonempty evidence; observed count 0")'

          deploy_check="AI chat response"
          ai_response="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -X POST http://127.0.0.1:3001/api/ai/chat \
            -H 'Content-Type: application/json' \
            --data '{"message":"Reply with exactly one word: OK","reasoning_effort":"low"}')"
          printf '%s\n' "$ai_response" | python3 -c 'import json,sys; d=json.load(sys.stdin); size=len(d.get("message", "").strip()); print("ai_response_chars=" + str(size)); size > 0 or (print("::error title=AI chat response::Expected a nonempty answer; observed 0 characters"), sys.exit(1))'

          deploy_check="Role Match development UI"
          about_html="$(mktemp)"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            http://127.0.0.1:3001/about > "$about_html"
          if ! grep -Fq 'Match a role' "$about_html"; then
            echo "::error title=Role Match development UI::Expected 'Match a role' in /about HTML; observed no matching text"
            exit 1
          fi
          rm -f "$about_html"
          printf 'role_match_dev_ui_present=true\n'

          deploy_check="Role Match development endpoint"
          role_match_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X POST http://127.0.0.1:3001/api/role-match/report \
            -H 'Content-Type: application/json' \
            --data '{"jobDescription":"short"}')"
          if [[ "$role_match_status" != 400 ]]; then
            echo "::error title=Role Match development endpoint::Expected HTTP 400 for an invalid short request; observed ${role_match_status}"
            exit 1
          fi
          printf 'role_match_dev_endpoint_status=%s\n' "$role_match_status"
