name: Fast AMD64 Build + Deploy

on:
  push:
    branches:
      - dev
    paths:
      - "frontend/**"
      - "server/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/fast-guardrail-build-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_TARGET_AMD64: x86_64-unknown-linux-musl
  RUSTUP_TOOLCHAIN: stable
  DEV_IMAGE: portfolio-app:dev

concurrency:
  group: fast-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: build + deploy
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: portfolio-self-hosted
      cancel-in-progress: true

    steps:
      - name: Repair workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            alpine:3.20 \
            chown -R "$(id -u):$(id -g)" /work

      - uses: actions/checkout@v7
        with:
          clean: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          cache_root="$HOME/.cache/portfolio-ci"
          export NPM_CONFIG_CACHE="$cache_root/npm"
          export CARGO_TARGET_DIR="$cache_root/cargo-target"
          export CARGO_HOME="$cache_root/cargo-home"
          export RUSTUP_HOME="$cache_root/rustup"
          export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"

          mkdir -p \
            "$NPM_CONFIG_CACHE" \
            "$CARGO_TARGET_DIR" \
            "$CARGO_HOME/bin" \
            "$RUSTUP_HOME"

          git reset --hard "$GITHUB_SHA"
          git clean -ffdx \
            -e frontend/node_modules/ \
            -e frontend/dist/ \
            -e release/amd64/

          (
            cd frontend
            npm install --ignore-scripts --no-audit --no-fund --prefer-offline
            npm rebuild esbuild --dangerously-allow-all-scripts --no-audit --no-fund
            npm run build
          )

          command -v rustup >/dev/null 2>&1 || {
            echo "rustup is required on the self-hosted runner."
            exit 1
          }

          if ! rustup toolchain list | grep -q '^stable'; then
            rustup toolchain install stable \
              --profile minimal \
              --target "$RUST_TARGET_AMD64"
          elif ! rustup target list --toolchain stable --installed | grep -qx "$RUST_TARGET_AMD64"; then
            rustup target add --toolchain stable "$RUST_TARGET_AMD64"
          fi

          if ! command -v cargo-zigbuild >/dev/null 2>&1; then
            cargo install cargo-zigbuild --locked
          fi

          (
            cd server
            cargo zigbuild --release --target "$RUST_TARGET_AMD64"
          )

          mkdir -p release/amd64
          cp "$CARGO_TARGET_DIR/$RUST_TARGET_AMD64/release/portfolio-server" release/amd64/portfolio-server
          chmod +x release/amd64/portfolio-server

          DOCKER_BUILDKIT=1 docker build \
            --build-arg TARGETARCH=amd64 \
            --tag "$DEV_IMAGE" \
            .

      - name: Deploy
        env:
          PORTFOLIO_IMAGE: ${{ env.DEV_IMAGE }}
          PORTFOLIO_PORT: "3001"
          PORTFOLIO_DATABASE_URL: ${{ secrets.PORTFOLIO_DATABASE_URL }}
          NINE_ROUTER_URL: ${{ vars.NINE_ROUTER_URL }}
          NINE_ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
          NINE_ROUTER_CONNECT_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_CONNECT_TIMEOUT_SECONDS }}
          NINE_ROUTER_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_TIMEOUT_SECONDS }}
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PORTFOLIO_DATABASE_URL:?Configure the PORTFOLIO_DATABASE_URL repository secret}"
          test "$(docker inspect --format '{{.State.Health.Status}}' shared-postgres)" = healthy
          docker compose -p portofolio config --quiet
          docker compose -p portofolio up -d --remove-orphans --no-build
          docker compose -p portofolio ps
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:3001/ > /dev/null

      - name: Generate branding raster assets and restore workflow
        shell: bash
        run: |
          set -euo pipefail

          if command -v magick >/dev/null 2>&1; then
            rasterizer=(magick)
          elif command -v convert >/dev/null 2>&1; then
            rasterizer=(convert)
          else
            echo "ImageMagick is required on the self-hosted runner for this one-time branding asset generation."
            exit 42
          fi

          "${rasterizer[@]}" -background none frontend/public/favicon.svg -resize 180x180 frontend/public/apple-touch-icon.png
          "${rasterizer[@]}" -background none frontend/public/favicon.svg -resize 192x192 frontend/public/icon-192.png
          "${rasterizer[@]}" -background none frontend/public/favicon.svg -resize 512x512 frontend/public/icon-512.png

          cat > /tmp/portfolio-og.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
            <rect width="1200" height="630" fill="#263526"/>
            <rect x="70" y="70" width="1060" height="490" rx="34" fill="#f6f5ef"/>
            <text x="120" y="230" font-family="DejaVu Sans, Arial, sans-serif" font-size="72" font-weight="700" fill="#263526">Faris Munir Mahdi</text>
            <text x="120" y="315" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="600" fill="#263526">Software Engineer</text>
            <text x="120" y="390" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" fill="#405740">Backend · Cloud · IoT · AI</text>
            <line x1="120" y1="440" x2="1080" y2="440" stroke="#263526" stroke-opacity="0.18" stroke-width="2"/>
            <text x="120" y="505" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#405740">farismnrr.com</text>
          </svg>
          SVG

          "${rasterizer[@]}" -background none /tmp/portfolio-og.svg -resize 1200x630 frontend/public/og-image.png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show "$GITHUB_SHA^:.github/workflows/fast-guardrail-build-deploy.yml" > .github/workflows/fast-guardrail-build-deploy.yml
          git add frontend/public/apple-touch-icon.png frontend/public/icon-192.png frontend/public/icon-512.png frontend/public/og-image.png .github/workflows/fast-guardrail-build-deploy.yml
          git commit -m "chore(branding): add raster icons and social card"
          git push origin HEAD:dev
