name: Fast AMD64 Build + Deploy

on:
  push:
    branches:
      - dev
    paths:
      - "frontend/**"
      - "server/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/fast-guardrail-build-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_TARGET_AMD64: x86_64-unknown-linux-musl
  RUSTUP_TOOLCHAIN: stable
  DEV_IMAGE: portfolio-app:dev

concurrency:
  group: fast-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: build + deploy
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: portfolio-self-hosted
      cancel-in-progress: true

    steps:
      - name: Repair workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            alpine:3.20 \
            chown -R "$(id -u):$(id -g)" /work

      - uses: actions/checkout@v7
        with:
          clean: false
          fetch-depth: 0

      - name: Generate raster branding assets and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --user --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path('frontend/public')
          bg = '#263526'
          fg = '#f6f5ef'

          def font(size, bold=False):
              candidates = [
                  '/usr/share/fonts/TTF/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/TTF/DejaVuSans.ttf',
                  '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
              ]
              for path in candidates:
                  if Path(path).exists():
                      return ImageFont.truetype(path, size=size)
              return ImageFont.load_default()

          def make_icon(size, path):
              image = Image.new('RGB', (size, size), bg)
              draw = ImageDraw.Draw(image)
              f = font(round(size * 0.34), bold=True)
              text = 'FM'
              box = draw.textbbox((0, 0), text, font=f)
              w, h = box[2] - box[0], box[3] - box[1]
              draw.text(((size - w) / 2, (size - h) / 2 - size * 0.035), text, font=f, fill=fg)
              image.save(root / path, format='PNG', optimize=True)

          make_icon(180, 'apple-touch-icon.png')
          make_icon(192, 'icon-192.png')
          make_icon(512, 'icon-512.png')

          image = Image.new('RGB', (1200, 630), '#f6f5ef')
          draw = ImageDraw.Draw(image)
          draw.rounded_rectangle((72, 72, 230, 230), radius=32, fill=bg)
          fm = font(58, bold=True)
          box = draw.textbbox((0, 0), 'FM', font=fm)
          draw.text((151 - (box[2]-box[0])/2, 151 - (box[3]-box[1])/2 - 7), 'FM', font=fm, fill=fg)
          name = font(66, bold=True)
          role = font(34, bold=False)
          focus = font(28, bold=False)
          draw.text((72, 292), 'Faris Munir Mahdi', font=name, fill='#11130f')
          draw.text((76, 390), 'Software Engineer', font=role, fill='#263526')
          draw.text((76, 456), 'Backend · Cloud · IoT · Practical AI', font=focus, fill='#51584f')
          draw.text((76, 532), 'farismnrr.com', font=font(24, bold=True), fill='#263526')
          image.save(root / 'og-image.png', format='PNG', optimize=True)
          PY

          git show "${GITHUB_SHA}^:.github/workflows/fast-guardrail-build-deploy.yml" > .github/workflows/fast-guardrail-build-deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/public/apple-touch-icon.png \
            frontend/public/icon-192.png \
            frontend/public/icon-512.png \
            frontend/public/og-image.png \
            .github/workflows/fast-guardrail-build-deploy.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat(seo): add raster branding assets"
            git push origin HEAD:dev
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          cache_root="$HOME/.cache/portfolio-ci"
          export NPM_CONFIG_CACHE="$cache_root/npm"
          export CARGO_TARGET_DIR="$cache_root/cargo-target"
          export CARGO_HOME="$cache_root/cargo-home"
          export RUSTUP_HOME="$cache_root/rustup"
          export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"

          mkdir -p \
            "$NPM_CONFIG_CACHE" \
            "$CARGO_TARGET_DIR" \
            "$CARGO_HOME/bin" \
            "$RUSTUP_HOME"

          git clean -ffdx \
            -e frontend/node_modules/ \
            -e frontend/dist/ \
            -e release/amd64/

          (
            cd frontend
            npm install --ignore-scripts --no-audit --no-fund --prefer-offline
            npm rebuild esbuild --dangerously-allow-all-scripts --no-audit --no-fund
            npm run build
          )

          command -v rustup >/dev/null 2>&1 || {
            echo "rustup is required on the self-hosted runner."
            exit 1
          }

          if ! rustup toolchain list | grep -q '^stable'; then
            rustup toolchain install stable \
              --profile minimal \
              --target "$RUST_TARGET_AMD64"
          elif ! rustup target list --toolchain stable --installed | grep -qx "$RUST_TARGET_AMD64"; then
            rustup target add --toolchain stable "$RUST_TARGET_AMD64"
          fi

          if ! command -v cargo-zigbuild >/dev/null 2>&1; then
            cargo install cargo-zigbuild --locked
          fi

          (
            cd server
            cargo zigbuild --release --target "$RUST_TARGET_AMD64"
          )

          mkdir -p release/amd64
          cp "$CARGO_TARGET_DIR/$RUST_TARGET_AMD64/release/portfolio-server" release/amd64/portfolio-server
          chmod +x release/amd64/portfolio-server

          DOCKER_BUILDKIT=1 docker build \
            --build-arg TARGETARCH=amd64 \
            --tag "$DEV_IMAGE" \
            .

      - name: Deploy
        env:
          PORTFOLIO_IMAGE: ${{ env.DEV_IMAGE }}
          PORTFOLIO_PORT: "3001"
          PORTFOLIO_DATABASE_URL: ${{ secrets.PORTFOLIO_DATABASE_URL }}
          NINE_ROUTER_URL: ${{ vars.NINE_ROUTER_URL }}
          NINE_ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
          NINE_ROUTER_CONNECT_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_CONNECT_TIMEOUT_SECONDS }}
          NINE_ROUTER_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_TIMEOUT_SECONDS }}
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PORTFOLIO_DATABASE_URL:?Configure the PORTFOLIO_DATABASE_URL repository secret}"
          test "$(docker inspect --format '{{.State.Health.Status}}' shared-postgres)" = healthy
          docker compose -p portofolio config --quiet
          docker compose -p portofolio up -d --remove-orphans --no-build
          docker compose -p portofolio ps
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:3001/ > /dev/null
