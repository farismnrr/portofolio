name: Fast Guardrail + AMD64 Build + Deploy

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  RUST_TARGET_AMD64: x86_64-unknown-linux-musl
  RUSTFLAGS: -D warnings
  DEV_IMAGE: portfolio-app:dev

concurrency:
  group: fast-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: incremental amd64 build + deploy
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: portfolio-self-hosted
      cancel-in-progress: true
    steps:
      - name: Require dev for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/dev" ]; then
            echo "Fast Guardrail + AMD64 Build + Deploy must be dispatched from dev."
            exit 1
          fi

      - name: Repair workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            alpine:3.20 \
            chown -R "$(id -u):$(id -g)" /work

      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1

      - name: Configure persistent build caches
        shell: bash
        run: |
          set -euo pipefail
          cache_root="$HOME/.cache/portfolio-ci"
          mkdir -p \
            "$cache_root/npm" \
            "$cache_root/frontend-node_modules-node24" \
            "$cache_root/cargo-target"

          rm -rf frontend/node_modules
          ln -s "$cache_root/frontend-node_modules-node24" frontend/node_modules

          echo "NPM_CONFIG_CACHE=$cache_root/npm" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cache_root/cargo-target" >> "$GITHUB_ENV"
          echo "Persistent cache root: $cache_root"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Reuse frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefer-offline

      - name: Frontend fast guardrail
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run guard
          npm run content:check
          npm run check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Ensure musl toolchain
        shell: bash
        run: |
          set -euo pipefail
          if command -v musl-gcc >/dev/null 2>&1; then
            exit 0
          fi

          if command -v pacman >/dev/null 2>&1; then
            sudo pacman -S --needed --noconfirm musl
          else
            echo "musl-gcc is missing and this self-hosted runner is not Arch/pacman based."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET_AMD64 }}
          components: rustfmt, clippy

      - name: Rust fast guardrail
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --release --target "$RUST_TARGET_AMD64" --all-features -- -D warnings

      - name: Incremental AMD64 runtime build
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "$RUST_TARGET_AMD64"

      - name: Stage AMD64 runtime binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release/amd64
          mkdir -p release/amd64
          cp "$CARGO_TARGET_DIR/$RUST_TARGET_AMD64/release/portfolio-server" release/amd64/portfolio-server
          chmod +x release/amd64/portfolio-server
          file release/amd64/portfolio-server

      - name: Build local AMD64 runtime image
        shell: bash
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build \
            --build-arg TARGETARCH=amd64 \
            --tag "$DEV_IMAGE" \
            .

      - name: Deploy local AMD64 image
        if: github.event_name != 'pull_request'
        env:
          PORTFOLIO_IMAGE: ${{ env.DEV_IMAGE }}
          PORTFOLIO_PORT: "3001"
          NINE_ROUTER_URL: ${{ vars.NINE_ROUTER_URL }}
          NINE_ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
          NINE_ROUTER_CONNECT_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_CONNECT_TIMEOUT_SECONDS }}
          NINE_ROUTER_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_TIMEOUT_SECONDS }}
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p portofolio up -d --remove-orphans --no-build
          docker compose -p portofolio ps
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3001/ > /dev/null
