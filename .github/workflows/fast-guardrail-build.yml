name: Fast Guardrail + Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fast-guardrail-build-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      server: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.server == 'true' }}
      ci: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            server:
              - 'server/**'
            ci:
              - 'AGENTS.md'
              - '.github/workflows/**'
            app:
              - 'frontend/**'
              - 'server/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'compose.yaml'
              - 'AGENTS.md'
              - '.github/workflows/**'

  frontend:
    name: frontend guardrail + build
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('frontend/package.json', 'frontend/.npmrc') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-offline
          npm ci --no-audit --no-fund --prefer-offline

      - name: Architecture / SOLID / DRY guard
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
        working-directory: frontend
        run: npm run guard

      - name: Validate Markdown and Mermaid content
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
        working-directory: frontend
        run: npm run content:check

      - name: Strict Svelte / TypeScript diagnostics
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
        working-directory: frontend
        run: npm run check

      - name: Build frontend once
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  server:
    name: server guardrail + build
    runs-on: ubuntu-24.04
    needs: [changes, frontend]
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          shared-key: portfolio-fast
          cache-targets: true
          cache-on-failure: true

      - name: Rust format
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.ci == 'true'
        working-directory: server
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: server
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build server
        working-directory: server
        run: cargo build --release
