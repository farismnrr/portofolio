name: Full Guardrail + Build + Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: farismnrr/portofolio/portfolio-app
  RUST_TARGET_AMD64: x86_64-unknown-linux-musl
  RUST_TARGET_ARM64: aarch64-unknown-linux-musl
  RUSTFLAGS: -D warnings

jobs:
  guardrail:
    name: full guardrail
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('frontend/package.json', 'frontend/.npmrc') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Prepare frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-offline
          npm ci --no-audit --no-fund --prefer-offline

      - name: Architecture / SOLID / DRY guard
        working-directory: frontend
        run: npm run guard

      - name: Validate Markdown and Mermaid content
        working-directory: frontend
        run: npm run content:check

      - name: Strict Svelte / TypeScript diagnostics
        working-directory: frontend
        run: npm run check

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET_AMD64 }},${{ env.RUST_TARGET_ARM64 }}
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          shared-key: portfolio-full
          cache-targets: true
          cache-on-failure: true

      - name: Rust format
        working-directory: server
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: server
        run: cargo clippy --release --target ${{ env.RUST_TARGET_AMD64 }} --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: server
        run: cargo test --release --target ${{ env.RUST_TARGET_AMD64 }} --all-targets --all-features

  ai-smoke:
    name: ai smoke
    runs-on: [self-hosted, Linux, X64]
    needs: guardrail
    env:
      NINE_ROUTER_URL: ${{ vars.NINE_ROUTER_URL }}
      NINE_ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
      NINE_ROUTER_CONNECT_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_CONNECT_TIMEOUT_SECONDS }}
      NINE_ROUTER_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_TIMEOUT_SECONDS }}
      NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
    steps:
      - name: Check configured 9router model
        shell: bash
        run: |
          set -euo pipefail

          for name in NINE_ROUTER_URL NINE_ROUTER_MODEL NINE_ROUTER_CONNECT_TIMEOUT_SECONDS NINE_ROUTER_TIMEOUT_SECONDS NINE_ROUTER_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "${name} is not available on the self-hosted runner."
              exit 1
            fi
          done

          payload="$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["NINE_ROUTER_MODEL"], "reasoning_effort": "low", "messages": [{"role": "user", "content": "hi"}]}))')"

          response="$(curl --fail --silent --show-error \
            "${NINE_ROUTER_URL%/}/chat/completions" \
            -H "Authorization: Bearer ${NINE_ROUTER_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "$payload")"

          answer="$(printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data["choices"][0]["message"]["content"].strip())')"

          if [ -z "$answer" ]; then
            echo "9router returned an empty answer."
            exit 1
          fi

          echo "Configured 9router model smoke test returned a non-empty answer."

  build:
    name: build
    runs-on: ubuntu-24.04
    needs: [guardrail, ai-smoke]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('frontend/package.json', 'frontend/.npmrc') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-offline
          npm ci --no-audit --no-fund --prefer-offline

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET_AMD64 }},${{ env.RUST_TARGET_ARM64 }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          shared-key: portfolio-full
          cache-targets: true
          cache-on-failure: true

      - name: Build AMD64 runtime binary
        working-directory: server
        run: cargo build --release --target ${{ env.RUST_TARGET_AMD64 }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild when missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-zigbuild > /dev/null 2>&1; then
            cargo install cargo-zigbuild --locked
          fi

      - name: Build ARM64 runtime binary
        working-directory: server
        run: cargo zigbuild --release --target ${{ env.RUST_TARGET_ARM64 }}

      - name: Stage architecture-specific runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/amd64 release/arm64
          cp "server/target/${RUST_TARGET_AMD64}/release/portfolio-server" release/amd64/portfolio-server
          cp "server/target/${RUST_TARGET_ARM64}/release/portfolio-server" release/arm64/portfolio-server
          chmod +x release/amd64/portfolio-server release/arm64/portfolio-server
          file release/amd64/portfolio-server release/arm64/portfolio-server

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push multi-architecture runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=portfolio-runtime
          cache-to: type=gha,mode=max,scope=portfolio-runtime

  deploy:
    name: deploy
    runs-on: [self-hosted, Linux, X64]
    needs: build
    permissions:
      contents: read
      packages: read
    concurrency:
      group: portfolio-self-hosted
      cancel-in-progress: true
    steps:
      - name: Repair self-hosted workspace ownership
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            alpine:3.20 \
            chown -R "$(id -u):$(id -g)" /work

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy latest to Arch host
        env:
          PORTFOLIO_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          PORTFOLIO_PORT: "3001"
          NINE_ROUTER_URL: ${{ vars.NINE_ROUTER_URL }}
          NINE_ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
          NINE_ROUTER_CONNECT_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_CONNECT_TIMEOUT_SECONDS }}
          NINE_ROUTER_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_TIMEOUT_SECONDS }}
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
        run: |
          docker compose -p portofolio pull
          docker compose -p portofolio up -d --remove-orphans
          docker compose -p portofolio ps
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3001/ > /dev/null
