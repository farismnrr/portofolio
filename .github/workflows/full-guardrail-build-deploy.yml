name: Full Guardrail + Build + Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: farismnrr/portofolio/portfolio-app

concurrency:
  group: portfolio-production-release
  cancel-in-progress: false

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Require dev branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/dev" ]; then
            echo "Full Guardrail + Build + Deploy must be dispatched from dev."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Require unreleased changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git diff --quiet origin/main...HEAD; then
            echo "dev has no changes to release to main."
            exit 1
          fi

  validate:
    name: full guardrail + build
    needs: preflight
    uses: ./.github/workflows/full-guardrail-build.yml
    secrets: inherit

  merge-release:
    name: merge dev to main
    runs-on: ubuntu-24.04
    needs: validate
    permissions:
      contents: write
      pull-requests: write
    outputs:
      main_sha: ${{ steps.merge.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Create or reuse release PR and merge it
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head dev \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head dev \
              --title "release: dev -> main" \
              --body "Production release created by Full Guardrail + Build + Deploy run ${GITHUB_RUN_ID}.")"
            pr_number="${pr_url##*/}"
          fi

          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --match-head-commit "$GITHUB_SHA"

          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "Merged PR #${pr_number} into main at ${main_sha}. dev was not deleted."

  publish:
    name: publish production image
    runs-on: ubuntu-24.04
    needs: merge-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-release.outputs.main_sha }}

      - name: Download production binaries
        uses: actions/download-artifact@v7
        with:
          name: production-runtime
          path: release

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push multi-architecture runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=portfolio-runtime
          cache-to: type=gha,mode=max,scope=portfolio-runtime

  deploy:
    name: deploy
    runs-on: [self-hosted, Linux, X64]
    needs: [merge-release, publish]
    permissions:
      contents: read
      packages: read
    concurrency:
      group: portfolio-self-hosted
      cancel-in-progress: true
    steps:
      - name: Repair self-hosted workspace ownership
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            alpine:3.20 \
            chown -R "$(id -u):$(id -g)" /work

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-release.outputs.main_sha }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy latest to Arch host
        env:
          PORTFOLIO_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          PORTFOLIO_PORT: "3001"
          NINE_ROUTER_URL: ${{ vars.NINE_ROUTER_URL }}
          NINE_ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
          NINE_ROUTER_CONNECT_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_CONNECT_TIMEOUT_SECONDS }}
          NINE_ROUTER_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_TIMEOUT_SECONDS }}
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
        run: |
          docker compose -p portofolio pull
          docker compose -p portofolio up -d --remove-orphans
          docker compose -p portofolio ps
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3001/ > /dev/null
