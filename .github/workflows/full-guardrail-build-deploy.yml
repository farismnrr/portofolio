name: Full Guardrail + Build + Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: farismnrr/portofolio/portfolio-app
  RUST_TARGET_AMD64: x86_64-unknown-linux-musl
  RUST_TARGET_ARM64: aarch64-unknown-linux-musl
  RUSTFLAGS: -D warnings

concurrency:
  group: portfolio-production-release
  cancel-in-progress: false

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Require dev branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/dev" ]; then
            echo "Full Guardrail + Build + Publish must be dispatched from dev."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Require unreleased changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git diff --quiet origin/main...HEAD; then
            echo "dev has no changes to release to main."
            exit 1
          fi

  frontend:
    name: frontend full guardrail + build
    runs-on: ubuntu-24.04
    needs: preflight
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('frontend/package.json', 'frontend/.npmrc') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-offline
          npm ci --no-audit --no-fund --prefer-offline

      - name: Architecture / SOLID / DRY guard
        working-directory: frontend
        run: npm run guard

      - name: Validate Markdown and Mermaid content
        working-directory: frontend
        run: npm run content:check

      - name: Strict Svelte / TypeScript diagnostics
        working-directory: frontend
        run: npm run check

      - name: Build frontend once
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  server:
    name: server full guardrail + production build
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Download frontend dist
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET_AMD64 }},${{ env.RUST_TARGET_ARM64 }}
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          shared-key: portfolio-full
          cache-targets: true
          cache-on-failure: true

      - name: Rust format
        working-directory: server
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: server
        run: cargo clippy --release --target ${{ env.RUST_TARGET_AMD64 }} --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: server
        run: cargo test --release --target ${{ env.RUST_TARGET_AMD64 }} --all-targets --all-features

      - name: Build AMD64 runtime binary
        working-directory: server
        run: cargo build --release --target ${{ env.RUST_TARGET_AMD64 }}

      - name: Set up pinned Zig
        shell: bash
        run: bash .github/scripts/setup-zig.sh

      - name: Install cargo-zigbuild when missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-zigbuild > /dev/null 2>&1; then
            cargo install cargo-zigbuild --locked
          fi

      - name: Build ARM64 runtime binary
        working-directory: server
        run: cargo zigbuild --release --target ${{ env.RUST_TARGET_ARM64 }}

      - name: Stage architecture-specific runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/amd64 release/arm64
          cp "server/target/${RUST_TARGET_AMD64}/release/portfolio-server" release/amd64/portfolio-server
          cp "server/target/${RUST_TARGET_ARM64}/release/portfolio-server" release/arm64/portfolio-server
          chmod +x release/amd64/portfolio-server release/arm64/portfolio-server
          file release/amd64/portfolio-server release/arm64/portfolio-server

      - name: Upload production binaries
        uses: actions/upload-artifact@v7
        with:
          name: production-runtime
          path: release/
          if-no-files-found: error
          retention-days: 1

  ai-smoke:
    name: ai smoke
    runs-on: [self-hosted, Linux, X64]
    needs: frontend
    env:
      NINE_ROUTER_URL: ${{ vars.NINE_ROUTER_URL }}
      NINE_ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
      NINE_ROUTER_CONNECT_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_CONNECT_TIMEOUT_SECONDS }}
      NINE_ROUTER_TIMEOUT_SECONDS: ${{ vars.NINE_ROUTER_TIMEOUT_SECONDS }}
      NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
    steps:
      - name: Check configured 9router model
        shell: bash
        run: |
          set -euo pipefail

          for name in NINE_ROUTER_URL NINE_ROUTER_MODEL NINE_ROUTER_CONNECT_TIMEOUT_SECONDS NINE_ROUTER_TIMEOUT_SECONDS NINE_ROUTER_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "${name} is not available on the self-hosted runner."
              exit 1
            fi
          done

          payload="$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["NINE_ROUTER_MODEL"], "reasoning_effort": "low", "messages": [{"role": "user", "content": "hi"}]}))')"

          response="$(curl --fail --silent --show-error \
            "${NINE_ROUTER_URL%/}/chat/completions" \
            -H "Authorization: Bearer ${NINE_ROUTER_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "$payload")"

          answer="$(printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data["choices"][0]["message"]["content"].strip())')"

          if [ -z "$answer" ]; then
            echo "9router returned an empty answer."
            exit 1
          fi

          echo "Configured 9router model smoke test returned a non-empty answer."

  container:
    name: multi-architecture container build
    runs-on: ubuntu-24.04
    needs: [server, ai-smoke]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Download production binaries
        uses: actions/download-artifact@v7
        with:
          name: production-runtime
          path: release

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Build multi-architecture runtime without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=portfolio-runtime
          cache-to: type=gha,mode=max,scope=portfolio-runtime

  merge-release:
    name: merge dev to main
    runs-on: ubuntu-24.04
    needs: container
    permissions:
      contents: write
      pull-requests: write
    outputs:
      main_sha: ${{ steps.merge.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Create or reuse release PR and merge it
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head dev \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head dev \
              --title "release: dev -> main" \
              --body "Production release created by Full Guardrail + Build + Publish run ${GITHUB_RUN_ID}.")"
            pr_number="${pr_url##*/}"
          fi

          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --match-head-commit "$GITHUB_SHA"

          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "Merged PR #${pr_number} into main at ${main_sha}. dev was not deleted."

  publish:
    name: publish production image
    runs-on: ubuntu-24.04
    needs: merge-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-release.outputs.main_sha }}

      - name: Download production binaries
        uses: actions/download-artifact@v7
        with:
          name: production-runtime
          path: release

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push multi-architecture runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge-release.outputs.main_sha }}
          cache-from: type=gha,scope=portfolio-runtime
          cache-to: type=gha,mode=max,scope=portfolio-runtime

  deploy-orangepi:
    name: deploy + verify Orange Pi
    runs-on: [self-hosted, Linux, X64]
    needs: [merge-release, publish]
    env:
      ORANGEPI_SSH_HOST: orangepi
      ORANGEPI_ROOT: /opt/portfolio
      MAIN_SHA: ${{ needs.merge-release.outputs.main_sha }}
      IMAGE: ghcr.io/farismnrr/portofolio/portfolio-app:${{ needs.merge-release.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-release.outputs.main_sha }}

      - name: Check Orange Pi transport
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 "$ORANGEPI_SSH_HOST" \
            'test "$(uname -m)" = aarch64 && test -d /opt/portfolio && test -f /opt/portfolio/.env'

      - name: Transfer production deployment definition
        shell: bash
        run: |
          set -euo pipefail
          scp -q \
            deploy/orangepi/compose.yaml \
            deploy/orangepi/deploy.sh \
            deploy/orangepi/verify.sh \
            deploy/orangepi/rollback.sh \
            "$ORANGEPI_SSH_HOST:$ORANGEPI_ROOT/"
          ssh -o BatchMode=yes "$ORANGEPI_SSH_HOST" \
            "chmod 750 '$ORANGEPI_ROOT/deploy.sh' '$ORANGEPI_ROOT/verify.sh' '$ORANGEPI_ROOT/rollback.sh'"

      - name: Deploy exact immutable main SHA
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$ORANGEPI_SSH_HOST" \
            "'$ORANGEPI_ROOT/deploy.sh' '$IMAGE'"

      - name: Verify production and roll back on failure
        shell: bash
        run: |
          set -euo pipefail
          if ssh -o BatchMode=yes "$ORANGEPI_SSH_HOST" \
            "'$ORANGEPI_ROOT/verify.sh' '$MAIN_SHA'"; then
            exit 0
          fi

          echo "Orange Pi verification failed; restoring the previous known-good application SHA." >&2
          ssh -o BatchMode=yes "$ORANGEPI_SSH_HOST" \
            "'$ORANGEPI_ROOT/rollback.sh'"
          previous_sha="$(ssh -o BatchMode=yes "$ORANGEPI_SSH_HOST" \
            "cat '$ORANGEPI_ROOT/state/deployed-sha'")"
          ssh -o BatchMode=yes "$ORANGEPI_SSH_HOST" \
            "'$ORANGEPI_ROOT/verify.sh' '$previous_sha'"
          echo "Rollback verification passed for ${previous_sha}." >&2
          exit 1
