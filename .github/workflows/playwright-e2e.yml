name: Playwright UI E2E

on:
  workflow_dispatch:
  push:
    branches:
      - fix/restore-new-ui
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/playwright-e2e.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: playwright-ui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: UI theme E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build static portfolio
        run: npm run build

      - name: Start production static server
        run: |
          npm start > /tmp/portfolio-e2e.log 2>&1 &
          echo $! > /tmp/portfolio-e2e.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-e2e.log
          exit 1

      - name: Run Playwright E2E
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/portfolio-e2e.log
          if-no-files-found: ignore
          retention-days: 14
