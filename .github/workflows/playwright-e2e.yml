name: Playwright UI E2E

on:
  workflow_dispatch:
  push:
    branches:
      - fix/restore-new-ui
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/playwright-e2e.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: playwright-ui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: UI theme E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build static portfolio
        run: npm run build

      - name: Start production static server
        run: |
          npm start > /tmp/portfolio-e2e.log 2>&1 &
          echo $! > /tmp/portfolio-e2e.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-e2e.log
          exit 1

      - name: Run Playwright E2E
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/portfolio-e2e.log
          if-no-files-found: ignore
          retention-days: 14


  visual-parity:
    name: Visual parity vs rescued UI
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Checkout rescued visual baseline
        uses: actions/checkout@v4
        with:
          ref: rescue/pre-vuetify-ui
          path: _baseline

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install candidate dependencies
        run: npm ci

      - name: Install visual test runtime
        run: npm install --no-save @playwright/test@1.55.0 pixelmatch@7 pngjs@7

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install baseline dependencies
        working-directory: _baseline
        run: npm ci

      - name: Build candidate
        run: npm run build

      - name: Build rescued baseline
        working-directory: _baseline
        run: npm run build

      - name: Start candidate and baseline servers
        run: |
          PORT=3001 node scripts/serve-spa.mjs > /tmp/candidate.log 2>&1 &
          python3 -m http.server 3100 --directory _baseline/dist > /tmp/baseline.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null && curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/candidate.log
          cat /tmp/baseline.log
          exit 1

      - name: Compare rescued UI screenshots
        env:
          BASELINE_URL: http://127.0.0.1:3100
          CANDIDATE_URL: http://127.0.0.1:3001
          MAX_VISUAL_DIFF_RATIO: "0.005"
        run: node tests/e2e/visual-parity.mjs

      - name: Upload visual parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-parity
          path: |
            visual-parity/
            /tmp/candidate.log
            /tmp/baseline.log
          if-no-files-found: ignore
          retention-days: 14

  publish-preview:
    name: Publish preview image
    needs: [e2e, visual-parity]
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/restore-new-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/portfolio-app:fix-restore-new-ui
            ghcr.io/${{ github.repository }}/portfolio-app:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
