name: Temporary Mailto E2E

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mailto-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install --package-lock-only
          npm ci

      - name: Install temporary Playwright runtime
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start preview server
        working-directory: frontend
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1

      - name: Run mailto browser E2E
        working-directory: frontend
        run: node ./scripts/temp-mailto-e2e.mjs
