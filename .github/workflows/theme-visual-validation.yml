name: Theme Visual Validation

on:
  push:
    branches:
      - feat/vuetify-ui

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run full engineering guard
        run: ./.agents/scripts/engineering-guard.sh portfolio full

      - name: Run maintainability ratchet
        run: python3 .agents/scripts/maintainability.py portfolio

      - name: Install temporary browser test tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start prerendered static server
        run: |
          python3 -m http.server 3006 --bind 127.0.0.1 --directory dist > /tmp/portfolio-preview.log 2>&1 &
          echo $! > /tmp/portfolio-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3006/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1

      - name: Create browser smoke test
        run: |
          cat > visual-smoke.spec.cjs <<'EOF'
          const { test, expect } = require("@playwright/test");

          async function collectHydrationErrors(page) {
            const errors = [];
            page.on("console", (message) => {
              const text = message.text();
              if (message.type() === "error" || /hydration|mismatch/i.test(text)) {
                errors.push(text);
              }
            });
            page.on("pageerror", (error) => errors.push(error.message));
            return errors;
          }

          test("light desktop renders consistently", async ({ browser }) => {
            const context = await browser.newContext({
              colorScheme: "light",
              viewport: { width: 1440, height: 1000 },
            });
            const page = await context.newPage();
            const errors = await collectHydrationErrors(page);
            await page.goto("http://127.0.0.1:3006/", { waitUntil: "networkidle" });
            await expect(page.locator("html")).toHaveAttribute("data-theme", "light");
            await expect(page.locator(".v-application")).toHaveClass(/v-theme--light/);
            await page.screenshot({ path: "visual-artifacts/home-light-desktop.png", fullPage: true });
            expect(errors).toEqual([]);
            await context.close();
          });

          test("dark desktop renders consistently and toggle persists", async ({ browser }) => {
            const context = await browser.newContext({
              colorScheme: "dark",
              viewport: { width: 1440, height: 1000 },
            });
            const page = await context.newPage();
            const errors = await collectHydrationErrors(page);
            await page.goto("http://127.0.0.1:3006/", { waitUntil: "networkidle" });
            await expect(page.locator("html")).toHaveAttribute("data-theme", "dark");
            await expect(page.locator(".v-application")).toHaveClass(/v-theme--dark/);
            await page.screenshot({ path: "visual-artifacts/home-dark-desktop.png", fullPage: true });

            await page.getByRole("button", { name: "Switch to light mode" }).click();
            await expect(page.locator("html")).toHaveAttribute("data-theme", "light");
            await expect(page.locator(".v-application")).toHaveClass(/v-theme--light/);
            expect(await page.evaluate(() => localStorage.getItem("theme"))).toBe("light");
            expect(errors).toEqual([]);
            await context.close();
          });

          test("mobile about and projects stay usable", async ({ browser }) => {
            const context = await browser.newContext({
              colorScheme: "dark",
              viewport: { width: 390, height: 844 },
              isMobile: true,
            });
            const page = await context.newPage();
            const errors = await collectHydrationErrors(page);

            await page.goto("http://127.0.0.1:3006/about", { waitUntil: "networkidle" });
            console.log("ABOUT_DEBUG", JSON.stringify(await page.evaluate(() => {
              const row = document.querySelector(".about-page .v-row");
              const cols = [...document.querySelectorAll(".about-page .v-col")];
              return {
                viewport: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
                row: row ? {
                  display: getComputedStyle(row).display,
                  flexWrap: getComputedStyle(row).flexWrap,
                  width: row.getBoundingClientRect().width,
                } : null,
                cols: cols.map((el) => ({
                  className: el.className,
                  width: el.getBoundingClientRect().width,
                  left: el.getBoundingClientRect().left,
                  flexBasis: getComputedStyle(el).flexBasis,
                })),
              };
            })));
            await expect(page.locator("html")).toHaveAttribute("data-theme", "dark");
            await expect(page.locator(".v-application")).toHaveClass(/v-theme--dark/);
            expect(await page.evaluate(() => document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1)).toBe(true);
            await page.screenshot({ path: "visual-artifacts/about-dark-mobile.png", fullPage: true });

            await page.goto("http://127.0.0.1:3006/projects", { waitUntil: "networkidle" });
            console.log("PROJECTS_DEBUG", JSON.stringify(await page.evaluate(() => {
              const list = document.querySelector(".project-list");
              const cards = [...document.querySelectorAll(".project-card")].slice(0, 3);
              const firstRow = document.querySelector(".project-card .v-row");
              const firstCols = [...document.querySelectorAll(".project-card .v-col")].slice(0, 2);
              return {
                viewport: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
                list: list ? {
                  className: list.className,
                  display: getComputedStyle(list).display,
                  flexDirection: getComputedStyle(list).flexDirection,
                  width: list.getBoundingClientRect().width,
                } : null,
                cards: cards.map((el) => ({
                  width: el.getBoundingClientRect().width,
                  left: el.getBoundingClientRect().left,
                })),
                firstRow: firstRow ? {
                  display: getComputedStyle(firstRow).display,
                  flexWrap: getComputedStyle(firstRow).flexWrap,
                  width: firstRow.getBoundingClientRect().width,
                } : null,
                firstCols: firstCols.map((el) => ({
                  className: el.className,
                  width: el.getBoundingClientRect().width,
                  left: el.getBoundingClientRect().left,
                  flexBasis: getComputedStyle(el).flexBasis,
                })),
              };
            })));
            console.log("HYDRATION_ERRORS", JSON.stringify(errors));
            await expect(page.locator(".project-card").first()).toBeVisible();
            await page.screenshot({ path: "visual-artifacts/projects-dark-mobile.png", fullPage: true });
            expect(errors).toEqual([]);
            await context.close();
          });
          EOF

      - name: Run browser smoke test
        run: |
          mkdir -p visual-artifacts
          npx playwright test visual-smoke.spec.cjs --workers=1

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuetify-theme-visuals
          path: visual-artifacts
          if-no-files-found: warn
