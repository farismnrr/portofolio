name: Vuetify DRY Validation

on:
  push:
    branches:
      - feat/vuetify-ui

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./.agents/scripts/engineering-guard.sh portfolio full
      - run: python3 .agents/scripts/maintainability.py portfolio
