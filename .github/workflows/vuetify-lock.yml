name: Generate Vuetify lockfile

on:
  push:
    branches:
      - feat/vuetify-ui

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install vuetify@4.2.2 --save --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: vuetify-package-lock
          path: package-lock.json
