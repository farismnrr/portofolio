services:
  portfolio:
    image: ${PORTFOLIO_IMAGE:-ghcr.io/farismnrr/portofolio/portfolio-app:latest}
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "${PORTFOLIO_PORT:-3001}"
      DATABASE_URL: "${PORTFOLIO_DATABASE_URL:?PORTFOLIO_DATABASE_URL is required for shared-postgres}"
