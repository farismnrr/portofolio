name: portfolio

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?POSTGRES_SUPERUSER is required}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
    volumes:
      - portfolio-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  portfolio:
    image: ${PORTFOLIO_IMAGE:?PORTFOLIO_IMAGE must be an immutable GHCR SHA tag}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTFOLIO_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "${PORTFOLIO_PORT:-3001}"
      DATABASE_URL: ${PORTFOLIO_DATABASE_URL:?PORTFOLIO_DATABASE_URL is required}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  portfolio-postgres-data:
