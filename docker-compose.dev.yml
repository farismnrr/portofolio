services:
  portofolio:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        BUILDKIT_INLINE_CACHE: 1
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-management:
    build:
      context: ./services/Multitenant-User-Management-Service
      dockerfile: Dockerfile.dev
      args:
        BUILDKIT_INLINE_CACHE: 1
    ports:
      - "5500:5500"
    volumes:
      - ./services/Multitenant-User-Management-Service:/app
      - /app/target
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
    environment:
      - RUST_LOG=${RUST_LOG}
      - DATABASE_URL=${DATABASE_URL}
      - CORE_DB_TYPE=${UM_DB_TYPE}
      - CORE_DB_NAME=${UM_DB_NAME}
    env_file:
      - .env.dev
    # Ensure hot reload works by mounting source
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5500/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  backend:
    build:
      context: ./services/Portfolio-Backend-Service
      dockerfile: Dockerfile.dev
      args:
        BUILDKIT_INLINE_CACHE: 1
    ports:
      - "8080:8080"
    volumes:
      - ./services/Portfolio-Backend-Service:/app
      - /app/tmp
    environment:
      - PORT=${PORT}
      - SSO_URL=${SSO_URL}
      - CORE_DB_TYPE=${CORE_DB_TYPE}
      - CORE_DB_HOST=${CORE_DB_HOST}
      - CORE_DB_PORT=${CORE_DB_PORT}
      - CORE_DB_USER=${CORE_DB_USER}
      - CORE_DB_PASS=${CORE_DB_PASS}
      - CORE_DB_NAME=${CORE_DB_NAME}
      - DATABASE_URL=${BACKEND_DATABASE_URL}
    env_file:
      - .env.dev
    depends_on:
      user-management:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
