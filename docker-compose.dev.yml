services:
  portofolio:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        BUILDKIT_INLINE_CACHE: 1
    working_dir: /app
    ports:
      - "${SERVER_PORT:-3000}:3000"
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./:/app
      - portofolio_dev_data:/app/.dev_data
    environment:
      - NODE_ENV=${NODE_ENV}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - DB_HOST=postgres-sql
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-sql:5432/${POSTGRES_DB}
      - CORE_DB_SEED_DUMMY=true
    env_file:
      - .env.dev
    depends_on:
      postgres-sql:
        condition: service_healthy
      user-management:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-management:
    build:
      context: ./services/Multitenant-User-Management-Service
      dockerfile: Dockerfile.dev
      args:
        BUILDKIT_INLINE_CACHE: 1
    ports:
      - "${AUTH_PORT:-5500}:5500"
    volumes:
      - ./services/Multitenant-User-Management-Service:/app
      - user_management_dev_data:/app/.dev_data
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-sql:5432/${UM_DB_NAME:-iotnet_auth}
      - CORE_DB_TYPE=postgres
      - CORE_DB_HOST=postgres-sql
      - CORE_DB_PORT=5432
      - CORE_DB_USER=${POSTGRES_USER}
      - CORE_DB_PASS=${POSTGRES_PASSWORD}
      - CORE_DB_NAME=${UM_DB_NAME:-iotnet_auth}
    env_file:
      - .env.dev
    depends_on:
      postgres-sql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5500/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  postgres-sql:
    image: postgres:16-alpine
    container_name: postgres-sql
    env_file:
      - .env.dev
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  portofolio_dev_data:
  user_management_dev_data:
  postgres_dev_data:
