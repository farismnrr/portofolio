services:
  portofolio:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        BUILDKIT_INLINE_CACHE: 1
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=${NODE_ENV}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-management:
    build:
      context: ./services/Multitenant-User-Management-Service
      dockerfile: Dockerfile.dev
      args:
        BUILDKIT_INLINE_CACHE: 1
    ports:
      - "5500:5500"
    volumes:
      - ./services/Multitenant-User-Management-Service:/app
      - /app/target
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - CORE_DB_TYPE=${UM_DB_TYPE:-sqlite}
      - CORE_DB_NAME=${UM_DB_NAME:-user_auth_plugin.sqlite}
    env_file:
      - .env.dev
    # Ensure hot reload works by mounting source
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5500/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  backend:
    build:
      context: ./services/Portfolio-Backend-Service
      dockerfile: Dockerfile.dev
      args:
        BUILDKIT_INLINE_CACHE: 1
    ports:
      - "8080:8080"
    volumes:
      - ./services/Portfolio-Backend-Service:/app
      - ./services/Portfolio-Backend-Service/secret:/app/secret
    environment:
      - DATABASE_URL=${BACKEND_DATABASE_URL}
      - CORE_DB_SEED_DUMMY=true
    env_file:
      - .env.dev
    depends_on:
      user-management:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
