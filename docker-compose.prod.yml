services:
  postgres:
    image: postgres:15-alpine
    container_name: portfolio-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployments/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - portfolio-network

  sso-service:
    image: ghcr.io/farismnrr/user_auth_plugin:latest
    container_name: sso-service
    env_file:
      - .env.prod
    environment:
      - CORE_DB_TYPE=postgres
      - CORE_DB_HOST=${POSTGRES_HOST}
      - CORE_DB_PORT=${POSTGRES_PORT}
      - CORE_DB_USER=${POSTGRES_USER}
      - CORE_DB_PASS=${POSTGRES_PASSWORD}
      - CORE_DB_NAME=${SSO_DB_NAME}
      - SERVER_HOST=${SSO_SERVER_HOST}
      - SERVER_PORT=${SSO_PORT}
      - ENDPOINT=${SSO_ENDPOINT}
      - SECRET_KEY=${SSO_SECRET_KEY}
      - TENANT_SECRET_KEY=${SSO_TENANT_SECRET_KEY}
      - API_KEY=${API_KEY}
      - JWT_SECRET=${SSO_JWT_SECRET}
      - ACCESS_TOKEN_EXPIRY=${SSO_JWT_ACCESS_TOKEN_EXPIRY}
      - REFRESH_TOKEN_EXPIRY=${SSO_JWT_REFRESH_TOKEN_EXPIRY}
      - COOKIE_DOMAIN=${SSO_COOKIE_DOMAIN}
      - VITE_ALLOWED_ORIGINS=${SSO_VITE_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SSO_PORT}:${SSO_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SSO_PORT}/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: always
    networks:
      - portfolio-network

  portfolio-app:
    image: ghcr.io/farismnrr/portofolio/portfolio-app:latest
    container_name: portfolio-app
    env_file:
      - .env.prod
    environment:
      # --- Backend Env ---
      - PORT=8080
      - ENV=production
      - API_KEY=${API_KEY}
      - TENANT_ID=${TENANT_ID}
      - CORE_DB_TYPE=postgres
      - CORE_DB_HOST=${POSTGRES_HOST}
      - CORE_DB_PORT=${POSTGRES_PORT}
      - CORE_DB_USER=${POSTGRES_USER}
      - CORE_DB_PASS=${POSTGRES_PASSWORD}
      - CORE_DB_NAME=${BACKEND_DB_NAME}
      - PAGE_ACCESS_PASSWORD=${PAGE_ACCESS_PASSWORD}
      - LOG_LEVEL=${BACKEND_LOG_LEVEL}
      - ALLOWED_ORIGINS=${BACKEND_ALLOWED_ORIGINS}
      - SSO_URL=${SSO_INTERNAL_URL} or http://sso-service:${SSO_PORT}
      - SWAGGER_API_KEY=${BACKEND_SWAGGER_API_KEY}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME}
      - GCP_CREDENTIALS_PATH=${GCP_CREDENTIALS_PATH}
      - GCP_SERVICE_ACCOUNT_EMAIL=${GCP_SERVICE_ACCOUNT_EMAIL}
      - GCP_P12_PASSWORD=${GCP_P12_PASSWORD}
      # --- Frontend Env ---
      - BACKEND_INTERNAL_URL=http://localhost:8080
      - HOSTNAME=0.0.0.0
    ports:
      - "${FRONTEND_PORT}:3000"
      - "${BACKEND_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      sso-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

volumes:
  postgres_data:
