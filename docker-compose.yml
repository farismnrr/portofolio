services:
  postgres:
    image: postgres:15-alpine
    container_name: portfolio-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployments/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio-network

  sso-service:
    build:
      context: ./services/Multitenant-User-Management-Service
      dockerfile: Dockerfile
    container_name: sso-service
    env_file:
      - .env.prod
    environment:
      - CORE_DB_TYPE=postgres
      - CORE_DB_HOST=${POSTGRES_HOST}
      - CORE_DB_PORT=${POSTGRES_PORT}
      - CORE_DB_USER=${POSTGRES_USER}
      - CORE_DB_PASS=${POSTGRES_PASSWORD}
      - CORE_DB_NAME=${SSO_DB_NAME}
      - SERVER_HOST=${SSO_SERVER_HOST}
      - SERVER_PORT=${SSO_PORT}
      - ENDPOINT=${SSO_ENDPOINT}
      - SECRET_KEY=${SSO_SECRET_KEY}
      - TENANT_SECRET_KEY=${SSO_TENANT_SECRET_KEY}
      - API_KEY=${API_KEY}
      - JWT_SECRET=${SSO_JWT_SECRET}
      - ACCESS_TOKEN_EXPIRY=${SSO_JWT_ACCESS_TOKEN_EXPIRY}
      - REFRESH_TOKEN_EXPIRY=${SSO_JWT_REFRESH_TOKEN_EXPIRY}
      - COOKIE_DOMAIN=${SSO_COOKIE_DOMAIN}
      - VITE_ALLOWED_ORIGINS=${SSO_VITE_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SSO_PORT}:${SSO_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SSO_PORT}/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - portfolio-network

  backend-service:
    build:
      context: ./services/Portfolio-Backend-Service
      dockerfile: Dockerfile
    container_name: backend-service
    env_file:
      - .env.prod
    environment:
      - PORT=${BACKEND_PORT}
      - ENV=production
      - API_KEY=${API_KEY}
      - TENANT_ID=${TENANT_ID}
      - CORE_DB_TYPE=postgres
      - CORE_DB_HOST=${POSTGRES_HOST}
      - CORE_DB_PORT=${POSTGRES_PORT}
      - CORE_DB_USER=${POSTGRES_USER}
      - CORE_DB_PASS=${POSTGRES_PASSWORD}
      - CORE_DB_NAME=${BACKEND_DB_NAME}
      - PAGE_ACCESS_PASSWORD=${PAGE_ACCESS_PASSWORD}
      - LOG_LEVEL=${BACKEND_LOG_LEVEL}
      - ALLOWED_ORIGINS=${BACKEND_ALLOWED_ORIGINS}
      - SSO_URL=${SSO_INTERNAL_URL}
      - SWAGGER_API_KEY=${BACKEND_SWAGGER_API_KEY}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME}
      - GCP_CREDENTIALS_PATH=${GCP_CREDENTIALS_PATH}
      - GCP_SERVICE_ACCOUNT_EMAIL=${GCP_SERVICE_ACCOUNT_EMAIL}
      - GCP_P12_PASSWORD=${GCP_P12_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      sso-service:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT}/health"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - portfolio-network

  frontend-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SSO_URL=${NEXT_PUBLIC_SSO_URL}
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
        - NEXT_PUBLIC_TENANT_ID=${NEXT_PUBLIC_TENANT_ID}
        - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY}
    container_name: frontend-app
    env_file:
      - .env.prod
    environment:
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL}
      - HOSTNAME=0.0.0.0
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      backend-service:
        condition: service_healthy
      sso-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FRONTEND_PORT}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

volumes:
  postgres_data:
