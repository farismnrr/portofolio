[package]
name = "portfolio-server"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = "0.8"
mime_guess = "2"
rust-embed = "8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
