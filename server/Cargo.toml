[package]
name = "portfolio-server"
version = "0.3.0"
edition = "2021"

# Rust 1.97 exposes linker stderr through the special `linker_messages` lint.
# Zig/cargo-zigbuild emits the known deprecated `-O1` linker note even when linking succeeds.
[lints.rust]
linker_messages = "allow"

[dependencies]
axum = "0.8"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "fs", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
