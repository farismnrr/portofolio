        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete Skill Category
      tags:
      - About
    patch:
      consumes:
      - application/json
      description: Updates category details.
      parameters:
      - description: Category ID
        in: path
        name: id
