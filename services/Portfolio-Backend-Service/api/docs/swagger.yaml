        type: string
    type: object
  handler.TagRequest:
    properties:
      icon:
        type: string
      name:
        type: string
      order_by:
        type: integer
    type: object
  handler.UpdateAboutRequest:
    properties:
      avatar:
        type: string
      description:
        type: string
      name:
        type: string
      role:
        type: string
    required:
    - description
    - name
    - role
    type: object
  handler.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
      tenant_id:
        type: string
      username:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      data:
        description: For additional error data
      details:
        description: For validation errors
      message:
        type: string
      status:
        type: boolean
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: hello@farismnrr.com
    name: Faris M.
    url: https://farismnrr.com
  description: Interactive API documentation for the Portfolio Backend Service.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Portfolio Backend API
  version: "1.0"
paths:
  /v1/about:
    get:
      consumes:
      - application/json
      description: Fetch name, role, description, and avatar URL
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  additionalProperties:
                    $ref: '#/definitions/handler.AboutResponse'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get basic profile
      tags:
      - About
    patch:
      consumes:
      - application/json
      description: Update name, role, and description
      parameters:
      - description: Profile Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateAboutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update profile
      tags:
      - About
  /v1/about/avatar:
