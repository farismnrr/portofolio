        items:
          $ref: '#/definitions/handler.TagRequest'
        type: array
      title:
        type: string
    type: object
  handler.CreateEducationRequest:
    properties:
      about_id:
        type: string
      degree:
        type: string
      description:
        type: string
      institution:
        type: string
      order_by:
        type: integer
      period:
        type: string
    type: object
  handler.CreateSocialLinkRequest:
    properties:
      about_id:
        description: Assuming we link it to an about profile
        type: string
      icon:
        description: Make sure entity has this
        type: string
      link:
        type: string
      name:
        type: string
      order_by:
        type: integer
    type: object
  handler.CreateWorkRequestFull:
    properties:
      about_id:
        type: string
      company:
        type: string
      description:
        type: string
      order_by:
        type: integer
      role:
        type: string
      timeframe:
        type: string
    type: object
