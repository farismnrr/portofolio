host: localhost:8080
info:
  contact:
    email: hello@farismnrr.com
    name: Faris M.
    url: https://farismnrr.com
  description: Interactive API documentation for the Portfolio Backend Service.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Portfolio Backend API
  version: "1.0"
paths:
  /v1/about:
    get:
      consumes:
      - application/json
      description: Fetch name, role, description, and avatar URL
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  additionalProperties:
                    $ref: '#/definitions/handler.AboutResponse'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get basic profile
      tags:
      - About
    patch:
      consumes:
      - application/json
      description: Update name, role, and description
      parameters:
      - description: Profile Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateAboutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Invalid request payload format
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "415":
          description: Unsupported media type
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update profile
      tags:
      - About
  /v1/about/avatar:
    patch:
      consumes:
      - multipart/form-data
      description: Upload image to GCS and update profile
      parameters:
      - description: Avatar image file
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Successfully Updated
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update avatar
      tags:
      - About
  /v1/about/education:
    get:
      consumes:
      - application/json
      description: Retrieves list of degrees and institutions.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully Retrieve
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  additionalProperties:
                    items:
                      $ref: '#/definitions/entity.Education'
                    type: array
                  type: object
              type: object
        "401":
          description: Unauthorized (Missing or Invalid Token)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Educations
      tags:
      - About
    post:
      consumes:
      - application/json
      description: Adds a new education entry.
      parameters:
      - description: Education Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateEducationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized (Missing or Invalid Token)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden (Insufficient Permissions)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Validation Failed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create Education
      tags:
      - About
  /v1/about/education/{id}:
    delete:
      consumes:
      - application/json
      description: Removes an education record (Soft Delete).
      parameters:
      - description: Education ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully Deleted
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized (Missing or Invalid Token)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden (Insufficient Permissions)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete Education
      tags:
      - About
    patch:
      consumes:
      - application/json
      description: Updates an education record.
      parameters:
      - description: Education ID
        in: path
        name: id
        required: true
        type: string
      - description: Education Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateEducationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully Updated
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized (Missing or Invalid Token)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden (Insufficient Permissions)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Validation Failed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update Education
      tags:
      - About
  /v1/about/skills:
    get:
      consumes:
      - application/json
      description: Retrieves all skill categories and their associated tags.
      produces:
