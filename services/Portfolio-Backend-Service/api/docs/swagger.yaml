      created_at:
        type: string
      icon:
        type: string
      id:
        type: string
      link:
        type: string
      name:
        type: string
      order_by:
        type: integer
      updated_at:
        type: string
    type: object
  entity.WorkExperience:
    properties:
      about_id:
        type: string
      company:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      order_by:
        type: integer
      role:
        type: string
      timeframe:
        type: string
      updated_at:
        type: string
    type: object
  entity.WorksMetadata:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      likes_count:
        type: integer
      slug:
        type: string
      updated_at:
        type: string
      views_count:
        type: integer
    type: object
  handler.AboutResponse:
    properties:
      avatar:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  handler.AuthenticateRequest:
    properties:
      password:
        example: your-strong-password
        type: string
    required:
    - password
    type: object
  handler.AuthenticateResponse:
    properties:
      success:
        example: true
        type: boolean
    type: object
  handler.CheckAuthResponse:
    properties:
      authenticated:
        example: true
        type: boolean
    type: object
  handler.CreateCategoryRequest:
    properties:
      about_id:
        type: string
      description:
        type: string
      order_by:
        type: integer
