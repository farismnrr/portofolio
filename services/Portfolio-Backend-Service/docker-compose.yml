version: '3.8'

services:
  portfolio-backend:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: portfolio-backend-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
      - SSO_URL=${SSO_URL:-http://localhost:8000}
      - API_KEY=${API_KEY}
      - TENANT_ID=${TENANT_ID}
      - PAGE_ACCESS_PASSWORD=${PAGE_ACCESS_PASSWORD}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORE_DB_SEED_DUMMY=true
    restart: unless-stopped
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
