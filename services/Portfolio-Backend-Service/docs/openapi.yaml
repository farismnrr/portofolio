openapi: 3.0.3
info:
  title: Portfolio Backend Service API
  description: |-
    Backend service for the portfolio application, providing authentication proxying, 
    page protection, Open Graph metadata fetching, and SSO configuration endpoints.
    
    This service integrates with the Multitenant User Management Service for authentication
    and provides a clean API for the Next.js frontend.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8080/v1
    description: Development server
  - url: https://api.yourdomain.com/v1
    description: Production server

tags:
  - name: Config
    description: SSO configuration endpoints
  - name: Page Auth
    description: Password-based page authentication
  - name: Open Graph
    description: OG metadata fetching and image proxying
  - name: Auth
    description: SSO authentication proxy

paths:
  /config/sso:
    get:
      tags:
        - Config
      summary: Get SSO configuration
      description: Returns the SSO service URL and tenant ID for frontend authentication
      operationId: getSSOConfig
      responses:
        '200':
          description: Successfully retrieved SSO configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOConfigSuccessResponse'

  /page-auth/authenticate:
    post:
      tags:
        - Page Auth
      summary: Authenticate with password
      description: Verifies password and sets authentication cookie for protected pages
      operationId: authenticate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseNoData'
          headers:
            Set-Cookie:
              description: Authentication cookie
              schema:
                type: string
                example: authToken=authenticated; Path=/; HttpOnly
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Incorrect password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /page-auth/check:
    get:
      tags:
        - Page Auth
      summary: Check authentication status
      description: Checks if the user is authenticated via cookie
      operationId: checkAuth
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User is authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAuthSuccessResponse'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /og/fetch:
    get:
      tags:
        - Open Graph
      summary: Fetch Open Graph metadata
      description: Fetches and extracts Open Graph metadata from a given URL
      operationId: fetchMetadata
      parameters:
        - name: url
          in: query
          required: true
          description: URL to fetch metadata from
          schema:
            type: string
            format: uri
            example: https://example.com
      responses:
        '200':
          description: Metadata fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OGMetadataSuccessResponse'
        '400':
          description: URL parameter is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to fetch metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /og/proxy:
    get:
      tags:
        - Open Graph
      summary: Proxy image request
      description: Proxies an image request with appropriate caching headers
      operationId: proxyImage
      parameters:
        - name: url
          in: query
          required: true
          description: Image URL to proxy
          schema:
            type: string
            format: uri
            example: https://example.com/image.jpg
      responses:
        '200':
          description: Image proxied successfully
          content:
            image/*:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              description: Cache control header
              schema:
                type: string
                example: public, max-age=86400
        '400':
          description: URL parameter is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to proxy image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login with refresh token
      description: Accepts refresh token from frontend and sets it as HttpOnly cookie
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseNoData'
          headers:
            Set-Cookie:
              description: Refresh token cookie
              schema:
                type: string
                example: refresh_token=abc123; Path=/; HttpOnly; Max-Age=2592000
        '400':
          description: Invalid request or missing refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Reads refresh token from cookie and gets new access token from SSO
      operationId: refreshToken
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenSuccessResponse'
        '401':
          description: No refresh token or refresh failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user:
    get:
      tags:
        - Auth
      summary: Get current user
      description: Validates access token with SSO and returns user information
      operationId: getUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessResponse'
        '401':
          description: No authorization header or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token

  schemas:
    # Base Response Schemas
    SuccessResponseNoData:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful

    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Error message
        details:
          type: object
          description: Validation error details (optional)

    # Config Schemas
    SSOConfigSuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: SSO configuration retrieved successfully
        data:
          type: object
          properties:
            ssoUrl:
              type: string
              format: uri
              example: http://localhost:8000
            tenantId:
              type: string
              example: tenant-123

    # Page Auth Schemas
    AuthenticateRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          example: mySecurePassword

    CheckAuthSuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Authenticated
        data:
          type: object
          properties:
            authenticated:
              type: boolean
              example: true

    # Open Graph Schemas
    OGMetadataSuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Metadata fetched successfully
        data:
          type: object
          properties:
            title:
              type: string
              example: Example Domain
            description:
              type: string
              example: This domain is for use in illustrative examples
            image:
              type: string
              format: uri
              example: https://example.com/image.jpg
            url:
              type: string
              format: uri
              example: https://example.com

    # Auth Schemas
    LoginRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    RefreshTokenSuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Token refreshed successfully
        data:
          type: object
          properties:
            access_token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            expires_in:
              type: integer
              example: 3600

    UserSuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User data retrieved successfully
        data:
          type: object
          properties:
            id:
              type: string
              example: user-123
            username:
              type: string
              example: johndoe
            email:
              type: string
              format: email
              example: john@example.com
            role:
              type: string
              example: admin
            tenant_id:
              type: string
              example: tenant-123
