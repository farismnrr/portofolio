<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio API Documentation</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
    <style>
        html { box-sizing: border-box; overflow: -moz-scrollbars-vertical; overflow-y: scroll; }
        *, *:before, *:after { box-sizing: inherit; }
        body { margin: 0; background: #fafafa; }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    <!-- Dynamic config from backend -->
    <script src="/swagger/config.js"></script>
    <script>
        window.onload = function() {
            const ui = SwaggerUIBundle({
                url: "/api/docs/swagger.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                onComplete: function() {
                    console.log('Swagger UI loaded');
                    
                    // Function to apply auth
                    const applyAuth = () => {
                        if (window.SWAGGER_CONFIG && window.SWAGGER_CONFIG.apiKey) {
                            console.log('Attempting to autofill API Key...');
                            try {
                                ui.preauthorizeApiKey('ApiKeyAuth', window.SWAGGER_CONFIG.apiKey);
                                console.log('Swagger API Key pre-authorized successfully');
                            } catch (e) {
                                console.error('Failed to pre-authorize API Key:', e);
                            }
                        }
                    };

                    // Try immediately
                    applyAuth();
                    
                    // Backup: try again after a short delay just in case of weird race conditions in UI rendering
                    setTimeout(applyAuth, 1000);
                }
            });
            window.ui = ui;
        };
    </script>
</body>
</html>
